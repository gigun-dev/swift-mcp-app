# XcodeGen によるアプリターゲット(MCPHost)定義。
#
# なぜ XcodeGen を採用するか:
# .xcodeproj は XML/plist の巨大な生成物で、複数人・複数セッションでの編集が
# コンフリクトしやすく差分レビューにも向かない。project.yml のような宣言的な
# テキスト定義から `xcodegen generate` で毎回作り直せば、.xcodeproj 自体は
# git 管理外(.gitignore)にでき、レビューすべき差分はこのファイルだけになる
# (docs/next-directions.md 2026-07-15 「雛形: XcodeGen + ローカル SwiftPM」の決定)。
#
# ロジック層(Kernel/Services)はここではなくルートの Package.swift 側で
# ローカル SwiftPM パッケージとして定義し、下記 dependencies で `path: .` として
# 取り込む。理由は Package.swift 側コメントを参照(swift test を Xcode なしで回すため)。
name: MCPHost

options:
  # Xcode の自動生成する Info.plist をやめ、targets 以下の設定だけで完結させる方が
  # XcodeGen の差分がシンプルになる(GENERATE_INFOPLIST_FILE を使う)。
  bundleIdPrefix: dev.gigun
  # Icon Composer の `.icon`(iOS 26 の Liquid Glass アイコン)は、拡張子こそ付いているが
  # 実体は `icon.json` + `Assets/` を含むディレクトリ(macOS のパッケージ)。XcodeGen は
  # 既定でディレクトリを「中身を展開して個別ファイルとして登録する」ため、そのままだと
  # icon.json と各レイヤー SVG がバラバラの resource として Copy Bundle Resources に入り、
  # Xcode 側は .icon パッケージを認識できずアイコンが反映されない(XcodeGen issue #1556)。
  # fileTypes で「icon 拡張子は単一ファイルとして扱う」と宣言してこれを防ぐ。
  # 2026-08-01 時点の XcodeGen はこれを既定にしていないため明示が要る(将来既定化されたら不要)。
  fileTypes:
    "icon":
      file: true

packages:
  MCPHostKernel:
    path: .

targets:
  MCPHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Features
    dependencies:
      # Kernel は Features から直接使わない可能性もあるが、TodosViewModel /
      # EventsViewModel 相当の描画ロジックを Features が Kernel の型で受け取る
      # 設計(CLAUDE.md)のため、雛形段階からリンクしておく。
      - package: MCPHostKernel
        product: Kernel
      - package: MCPHostKernel
        product: Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gigun.mcphost
        PRODUCT_NAME: MCPHost
        GENERATE_INFOPLIST_FILE: YES
        # Launch Screen の存在宣言。これが無いと iOS は「旧世代アプリ」とみなして
        # 画面を互換サイズ(レターボックス・上下黒帯)で起動する — シミュレータで
        # 「アプリの縦幅が狭い」として実際に発症した(2026-07-15)。生成 Info.plist に
        # UILaunchScreen(空 dict)を入れる INFOPLIST_KEY で宣言だけ行う。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # アプリアイコン。Xcode が新規プロジェクトに自動で入れる設定だが、XcodeGen の
        # 素の target には付かないため明示する(これが無いと Assets.xcassets を同梱しても
        # actool がどの appiconset を採用するか分からず、アイコンが空のままビルドが通る)。
        # 実体は Sources/Features/Resources/Assets.xcassets/AppIcon.appiconset/ ——
        # Xcode の GUI で Asset Catalog を「追加」すると参照が .xcodeproj にしか残らず
        # 次の `xcodegen generate` で消えるため、カタログはリポジトリ側のファイルとして持ち、
        # sources: Sources/Features 配下に置くことで毎回の生成に自動で載せている。
        # iOS 17+ かつ Xcode 15 以降は 1024x1024 単一画像(single-size)で全サイズを賄えるので、
        # 旧来の 20pt/29pt/... の多サイズ列挙はしない(App Store 提出用も同じ 1024 が使われる)。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # アプリ全体のアクセント色。UI 側は Color.accentColor を各所で使っているが、
        # これまで AccentColor の colorset が無く iOS 既定の青がそのまま出ていた。
        # アイコン(indigo 基調)と配色を揃えるために colorset を追加し、ここで名前を指す。
        # APPICON_NAME と同じく、Xcode の新規プロジェクトには自動で入るが XcodeGen では明示が要る。
        # Light は #4f46e5(indigo-600・発表スライドのアクセント色と同一)、
        # Dark は #818cf8(indigo-400)。暗い背景に indigo-600 を置くと沈んで押せなく見えるため、
        # 明度を上げた側を使う(colorset 側で appearance 分岐している)。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1" # iPhone のみ(iPad 対応は授業要件確定後に判断)
        # 2026-07-15: 当初は「個人チームに紐付けない」方針で CODE_SIGNING_ALLOWED: NO に
        # していたが、ユーザーが Xcode で Team を設定したため自動署名に切り替え
        # (P1 の OAuth/ASWebAuthenticationSession は実機検証が本命のため)。
        # Team ID は Xcode が .xcodeproj に書いた値を写経 — .xcodeproj は xcodegen で
        # 毎回作り直されるため、ここに書かないと generate のたびに設定が消える。
        DEVELOPMENT_TEAM: KK42DL23GH
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # ローカル HTTP MCP は Debug の exact loopback に限る。Release へ入れないこと、
          # NSAllowsArbitraryLoads / NSAllowsArbitraryLoadsInWebContent を使わないことが安全境界。
          # Xcode の INFOPLIST_KEY_* は入れ子 dictionary を生成できないため、Debug だけ明示 plist を使う。
          # Release は base の GENERATE_INFOPLIST_FILE=YES のままで ATS 例外を一切持たない。
          GENERATE_INFOPLIST_FILE: NO
          INFOPLIST_FILE: Config/Info-Debug.plist
          # XcodeGen の素の target は DEBUG 条件を自動付与しない。これが無いと plist だけ緩み、
          # MCPHostBuildPolicy は Release 相当 false のままという片側設定になる。
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
    # 自動生成される MCPHost スキームの Test アクションに UITest ターゲットを載せる。
    # こうすると `xcodebuild test -scheme MCPHost` で UITest が走る(専用スキームを別に作らず、
    # アプリと同じスキームの test 段へ相乗りするのが XcodeGen の素直な形)。build/run 段は不変。
    scheme:
      testTargets:
        - MCPHostUITests

  # native UI 回帰層(Fable queue 1・B0)。XCUIAutomation は XCTest ベースで、SwiftUI の
  # View 構築・ナビゲーション・起動経路という SPM テストの外側を守る。
  #
  # 【なぜ別ターゲット / 別 sources(UITests/)か】ルートの Package.swift(Kernel/Services の
  # swift-testing)とは実行系が別(XCUITest は host app を起動して外側から操作する)。SPM の Tests/ と
  # 混ぜず UITests/ に隔離し、`make check`(SPM)と `make uitest`(Xcode)を独立させる。
  # 【TEST_TARGET_NAME】UI テスト対象のアプリを指す(XCUIApplication がこのアプリを起動する)。
  # 【署名】シミュレータ実行なので Automatic + 個人 Team で足りる(実機 provisioning は要求しない)。
  MCPHostUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: MCPHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gigun.mcphost.uitests
        # PRODUCT_NAME を明示しないと生成物名が空になり、.xctest バンドルが "-Runner.app/PlugIns/.xctest"
        # (先頭ダッシュ=空名)として衝突する("Multiple commands produce ... .xctest")。アプリターゲットが
        # PRODUCT_NAME: MCPHost を明示しているのと同様に、UITest ターゲットにも明示する。
        PRODUCT_NAME: MCPHostUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: MCPHost
        DEVELOPMENT_TEAM: KK42DL23GH
        CODE_SIGN_STYLE: Automatic
